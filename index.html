<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ANIVIA — Discover. Watch. Remember.</title>
    <meta name="description" content="ANIVIA is a premium, responsive anime streaming and discovery UI. Discover trending series, follow weekly schedules and build your watchlist." />
    <meta name="theme-color" content="#0b0b10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ANIVIA" />
    <meta property="og:title" content="ANIVIA — Discover. Watch. Remember." />
    <meta property="og:description" content="Your anime universe. A premium anime streaming and discovery experience." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" /></noscript>
    <!-- Warm up connections to the data and image hosts -->
    <link rel="preconnect" href="https://graphql.anilist.co" crossorigin />
    <link rel="preconnect" href="https://s4.anilist.co" />
    <link rel="dns-prefetch" href="https://api.jikan.moe" />
    <link rel="dns-prefetch" href="https://cdn.myanimelist.net" />
    <link rel="dns-prefetch" href="https://wnmvktajokjhufuzpamy.supabase.co" />
    <script>
      // Apply the persisted theme, accent and font size before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('anivia:preferences')
          var pref = raw ? JSON.parse(raw).theme : 'dark'
          var theme = pref === 'system' || !pref
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : pref
          var p = raw ? JSON.parse(raw) : {}
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          root.style.colorScheme = theme
          if (p.accent && p.accent !== 'crimson') root.setAttribute('data-accent', p.accent)
          if (p.fontScale) root.setAttribute('data-font', p.fontScale)
          if (p.blurSynopsis) root.setAttribute('data-blur-synopsis', '')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>ANIVIA requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
