<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ANIVIA — Discover. Watch. Remember.</title>
    <meta name="description" content="ANIVIA is a premium, responsive anime streaming and discovery UI. Discover trending series, follow weekly schedules and build your watchlist." />
    <meta name="theme-color" content="#0b0b10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ANIVIA" />
    <meta property="og:title" content="ANIVIA — Discover. Watch. Remember." />
    <meta property="og:description" content="Your anime universe. A premium anime streaming and discovery experience." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('anivia:preferences')
          var pref = raw ? JSON.parse(raw).theme : 'dark'
          var theme = pref === 'system' || !pref
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : pref
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>ANIVIA requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
