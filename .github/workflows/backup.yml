name: Database backup

# Weekly pg_dump of the Supabase database, kept as a downloadable workflow artifact for 30 days
# (Actions → Database backup → latest run → Artifacts).
# Needs the repository secret SUPABASE_DB_URL (Project Settings → Database → connection string).
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Add the SUPABASE_DB_URL repository secret first."; exit 1; fi
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump public + auth schemas
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --schema=auth --no-owner --no-privileges -Fc -f anivia-$(date +%F).dump
          ls -lh *.dump
      - uses: actions/upload-artifact@v4
        with:
          name: anivia-db-backup
          path: '*.dump'
          retention-days: 30
